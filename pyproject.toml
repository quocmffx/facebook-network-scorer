[project]
name = "facebook-network-scorer"
version = "1.0.0"
description = "A tool to analyze Facebook exports and score the activity level of connections."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "rapidfuzz>=3.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "mypy",
    "ruff"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
